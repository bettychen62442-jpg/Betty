# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: betty-interview-coach
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /api/health
    disk:
      name: interview-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/app/data/interview-coach.db
      - key: AI_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: APP_USERNAME
        value: coach
      - key: APP_PASSWORD
        generateValue: true
