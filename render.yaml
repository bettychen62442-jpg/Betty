# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: betty-interview-coach
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: interview-coach
      - key: AI_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: supabase
      - key: APP_USERNAME
        value: coach
      - key: APP_PASSWORD
        generateValue: true
